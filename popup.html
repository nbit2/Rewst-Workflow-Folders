<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #1e293b;
    }
    .header-title {
      font-weight: 700;
      font-size: 13px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .header-org {
      font-size: 11px;
      color: #475569;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Not-on-page state ── */
    #not-on-page {
      padding: 24px 16px;
      text-align: center;
      color: #475569;
      font-size: 12px;
      line-height: 1.6;
    }
    #not-on-page strong {
      display: block;
      color: #64748b;
      margin-bottom: 6px;
    }

    /* ── View buttons ── */
    .view-section {
      padding: 8px 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .view-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.1s, color 0.1s;
    }
    .view-btn:hover { background: #1e293b; color: #e2e8f0; }
    .view-btn.active {
      background: #1d4ed8;
      color: #fff;
      font-weight: 500;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: #1e293b;
      margin: 4px 0;
    }

    /* ── Folder list ── */
    .folder-list {
      list-style: none;
      padding: 4px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 360px;
      overflow-y: auto;
    }
    .folder-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.1s;
      min-height: 32px;
    }
    .folder-item:hover { background: #1e293b; }
    .folder-item.active { background: #1e3a5f; }

    /* ── Toggle (expand/collapse) ── */
    .folder-toggle {
      width: 14px;
      flex-shrink: 0;
      text-align: center;
      font-size: 10px;
      color: #475569;
      cursor: pointer;
      user-select: none;
      line-height: 1;
    }
    .folder-toggle:hover { color: #94a3b8; }
    .folder-toggle.folder-toggle--leaf {
      cursor: default;
    }

    .folder-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .folder-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #cbd5e1;
      font-size: 12px;
    }
    .folder-count {
      font-size: 11px;
      color: #64748b;
      background: #0f172a;
      padding: 1px 7px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .folder-actions {
      display: none;
      gap: 2px;
      flex-shrink: 0;
    }
    .folder-item:hover .folder-actions { display: flex; }

    .icon-btn {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 12px;
      line-height: 1;
      font-family: inherit;
    }
    .icon-btn:hover { background: #334155; color: #e2e8f0; }
    .icon-btn.delete:hover { background: #7f1d1d; color: #fca5a5; }

    /* ── Empty state ── */
    .empty-folders {
      padding: 12px 10px;
      color: #475569;
      font-size: 12px;
      font-style: italic;
      text-align: center;
    }

    /* ── Create folder ── */
    .create-section {
      padding: 6px 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .create-btn {
      background: none;
      border: 1px dashed #1e293b;
      color: #475569;
      cursor: pointer;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      text-align: left;
      transition: border-color 0.1s, color 0.1s, background 0.1s;
    }
    .create-btn:hover { border-color: #3b82f6; color: #93c5fd; background: #1e3a5f; }

    /* ── Backup section ── */
    .backup-section {
      display: flex;
      gap: 6px;
    }
    .backup-btn {
      flex: 1;
      background: none;
      border: 1px solid #1e293b;
      color: #475569;
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-family: inherit;
      text-align: center;
      transition: border-color 0.1s, color 0.1s, background 0.1s;
    }
    .backup-btn:hover { border-color: #334155; color: #94a3b8; background: #1e293b; }
    .backup-btn.import-btn:hover { border-color: #10b981; color: #6ee7b7; background: #052e16; }

    /* ── Inline input ── */
    .inline-input {
      background: #1e293b;
      border: 1px solid #3b82f6;
      border-radius: 5px;
      color: #e2e8f0;
      font-size: 12px;
      font-family: inherit;
      padding: 5px 8px;
      outline: none;
      width: 100%;
    }
    .inline-input::placeholder { color: #475569; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-title">Folders</span>
    <span class="header-org" id="org-label"></span>
  </div>

  <div id="not-on-page" style="display:none">
    <strong>Not on Workflows page</strong>
    Navigate to your Rewst workflows list to use folder filtering.
  </div>

  <div id="main" style="display:none">
    <div class="view-section">
      <button class="view-btn active" data-view="all">All Workflows</button>
      <button class="view-btn" data-view="unfoldered">Unfoldered</button>
    </div>

    <div class="divider"></div>

    <ul class="folder-list" id="folder-list"></ul>

    <div class="divider"></div>

    <div class="create-section">
      <button class="create-btn" id="create-btn">+ New Folder</button>
      <div class="backup-section">
        <button class="backup-btn" id="export-btn">&#x2913; Export</button>
        <button class="backup-btn import-btn" id="import-btn">&#x2912; Import</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
